general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(6, 17, 27, 1.0)
}

label {
    monitor =
    text = $TIME
    color = rgba(224, 242, 254, 1.0)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(56, 189, 248, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(56, 189, 248, 1.0)
    inner_color = rgba(12, 32, 48, 0.92)
    font_color = rgba(224, 242, 254, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##a1a1aa">Contraseña...</span>
    hide_input = false
    check_color = rgba(16, 185, 129, 1.0)
    fail_color = rgba(239, 68, 68, 1.0)
    fail_text = <i>Contraseña incorrecta ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}
