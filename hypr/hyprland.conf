exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dunst
env = LIBGL_ALWAYS_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1

source = ~/.config/hypr/conf/monitors-auto.conf

exec-once = vmware-user-suid-wrapper
exec-once = awww-daemon
bind = SUPER, W, exec, ~/.local/bin/wallpaper-picker
bind = SUPER, B, exec, ~/.local/bin/shinobi-bar-toggle
bind = SUPER, code:54, exec, code
bind = ALT, code:54, exec, code
bind = SUPER, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle
bind = ALT, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle
bind = CTRL ALT, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle
layerrule = blur, rofi
layerrule = ignorezero, rofi
bind = SUPER, Q, exec, pkill -x rofi || hyprctl dispatch killactive
bind = SUPER, E, exec, /usr/bin/kitty -e /usr/bin/yazi





unbind = SUPER, M

# --- Audio automatico al iniciar sesion ---
exec-once = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 70%
bind = $mainMod, B, exec, firefox

# --- Optimizacion de fluidez en Maquina Virtual ---
decoration:blur:enabled = false
decoration:shadow:enabled = false
misc:vfr = true

# --- Cursor inicial ---
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Amber 24

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24









# Mover ventana activa al workspace N y enfocarlo (Super + Shift + 1..9)
unbind = SUPER SHIFT, 1
bind = SUPER SHIFT, code:10, movetoworkspace, 1
bind = CTRL ALT, code:10, movetoworkspace, 1
unbind = SUPER SHIFT, 2
bind = SUPER SHIFT, code:11, movetoworkspace, 2
bind = CTRL ALT, code:11, movetoworkspace, 2
unbind = SUPER SHIFT, 3
bind = SUPER SHIFT, code:12, movetoworkspace, 3
bind = CTRL ALT, code:12, movetoworkspace, 3
unbind = SUPER SHIFT, 4
bind = SUPER SHIFT, code:13, movetoworkspace, 4
bind = CTRL ALT, code:13, movetoworkspace, 4
unbind = SUPER SHIFT, 5
bind = SUPER SHIFT, code:14, movetoworkspace, 5
bind = CTRL ALT, code:14, movetoworkspace, 5
unbind = SUPER SHIFT, 6
bind = SUPER SHIFT, code:15, movetoworkspace, 6
bind = CTRL ALT, code:15, movetoworkspace, 6
unbind = SUPER SHIFT, 7
bind = SUPER SHIFT, code:16, movetoworkspace, 7
bind = CTRL ALT, code:16, movetoworkspace, 7
unbind = SUPER SHIFT, 8
bind = SUPER SHIFT, code:17, movetoworkspace, 8
bind = CTRL ALT, code:17, movetoworkspace, 8
unbind = SUPER SHIFT, 9
bind = SUPER SHIFT, code:18, movetoworkspace, 9
bind = CTRL ALT, code:18, movetoworkspace, 9

unbind = SUPER SHIFT, S

# Captura de pantalla (area y completa)
unbind = SUPER SHIFT, S
bind = SUPER SHIFT, S, exec, $HOME/.local/bin/screenshot
bind = , Print, exec, $HOME/.local/bin/screenshot
bind = SUPER, Print, exec, $HOME/.local/bin/screenshot full


# Animaciones SwayNC al abrir y cerrar
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = animation slide right, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-control-center
bind = $mainMod, L, exec, $HOME/.local/bin/shinobi-lock

# Blur para menu de sesion wlogout
layerrule = blur on, match:namespace logout_dialog
layerrule = ignore_alpha 0, match:namespace logout_dialog

# Acabado cristalino pro para Spotify
windowrule = opacity 0.86 0.80, match:class ^(Spotify|spotify)$
windowrule = rounding 20, match:class ^(Spotify|spotify)$

exec-once = ~/.local/bin/shinobi-bar-toggle --reload
bind = SUPER, code:54, exec, code
bind = ALT, code:54, exec, code
bind = SUPER, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle
bind = ALT, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle
bind = CTRL ALT, code:52, exec, $HOME/.local/bin/shinobi-dashboard-toggle

exec-once = eww -c ~/.config/eww daemon
