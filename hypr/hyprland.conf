env = LIBGL_ALWAYS_SOFTWARE,1
env = WLR_NO_HARDWARE_CURSORS,1

source = ~/.config/hypr/conf/monitors-auto.conf

exec-once = vmware-user-suid-wrapper
windowrulev2 = opacity 0.88 0.82, class:^(Spotify)$
exec-once = awww-daemon
bind = SUPER, W, exec, ~/.local/bin/wallpaper-picker
layerrule = blur, rofi
layerrule = ignorezero, rofi
bind = SUPER, Q, exec, pkill -x rofi || hyprctl dispatch killactive
bind = SUPER, E, exec, /usr/bin/kitty -e /usr/bin/yazi





# Spotify Mini-Player Flotante (Super+M y Super+S)
unbind = SUPER, M
windowrulev2 = float, class:^(Spotify|spotify)$
windowrulev2 = size 880 560, class:^(Spotify|spotify)$
windowrulev2 = center, class:^(Spotify|spotify)$
windowrulev2 = workspace special:spotify, class:^(Spotify|spotify)$
bind = SUPER, M, exec, ~/.local/bin/toggle-spotify
bind = SUPER, S, exec, ~/.local/bin/toggle-spotify

# --- Audio automatico al iniciar sesion ---
exec-once = wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 70%
bind = $mainMod, B, exec, firefox

# --- Optimizacion de fluidez en Maquina Virtual ---
decoration:blur:enabled = false
decoration:shadow:enabled = false
misc:vfr = true

# --- Cursor inicial ---
env = XCURSOR_THEME,Bibata-Modern-Amber
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor Bibata-Modern-Amber 24

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
